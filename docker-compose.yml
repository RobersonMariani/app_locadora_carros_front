services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locadora_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - locadora_network

volumes:
  frontend_node_modules:

networks:
  locadora_network:
    external: true
